# Real model. Same service, tools, advisor, and eval as the catalog profile.
# OpenAI-compatible servers work too: set OPENAI_BASE_URL and OPENAI_MODEL.
spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0
